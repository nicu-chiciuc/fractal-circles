<html>

<head>
  <style>
    .samebase-attribution {
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      bottom: max(8px, env(safe-area-inset-bottom));
      color: #394447;
      display: inline-flex;
      font: 12px system-ui, sans-serif;
      gap: 4px;
      left: max(8px, env(safe-area-inset-left));
      min-height: 44px;
      padding: 0 10px;
      position: fixed;
      text-decoration: none;
      z-index: 2;
    }

    .samebase-attribution img {
      height: 14px;
      width: 14px;
    }

    .samebase-attribution:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }
  </style>
</head>

<body style="margin: 0">
  <div id="drawing"></div>
  <canvas id="canvas"></canvas>
  <div style="position: fixed; top:10; left:10">
  	<p id="alpha">Not supported</p>
  	<p id="beta"></p>
  	<p id="gamma"></p>
  	<p id="mouseX"></p>
    <p id="mouseY"></p>
  </div>
  <a class="samebase-attribution" href="https://samebase.com" target="_blank" rel="noopener noreferrer"
    aria-label="Managed with Samebase">
    <span>Managed with</span>
    <img src="./samebase-logo.svg" alt="">
    <span>Samebase</span>
  </a>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.2/dat.gui.js"></script>
  <script src="./gyronorm.complete.min.js"></script>
  <script src="./utils.js"></script>
  <script src="./index.js"></script>
</body>

</html>
